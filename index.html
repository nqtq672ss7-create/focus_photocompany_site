<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="ФОКУС — современная российская фотокомпания. Интерьеры, мероприятия, съёмка гостей в отелях.">
  <title>ФОКУС — Фотокомпания</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero" aria-label="Главный экран сайта фотокомпании ФОКУС">
    <div class="hero__image" aria-hidden="true"></div>
    <video class="hero__video" aria-hidden="true" autoplay muted loop playsinline preload="auto" poster="assets/focus-lobby.png"><source src="assets/focus-hero.mp4" type="video/mp4"></video>
    <div class="hero__shade" aria-hidden="true"></div>
    <div class="hero__grain" aria-hidden="true"></div>

    <header class="topbar">
      <div class="topbar__left">
        <span class="topbar__line topbar__line--left" aria-hidden="true"></span>
      </div>

      <nav class="nav-panel" aria-label="Основная навигация">
        <a class="nav-panel__link is-active" href="#top" data-i18n="home">ГЛАВНАЯ</a>
        <a class="nav-panel__link" href="#about" data-i18n="about">О КОМПАНИИ</a>
        <a class="nav-panel__link" href="#services" data-i18n="services">УСЛУГИ</a>
        <a class="nav-panel__link" href="#works" data-i18n="works">ПРИМЕРЫ РАБОТ</a>
        <a class="nav-panel__link" href="#contacts" data-i18n="contacts">КОНТАКТЫ</a>
      </nav>

      <div class="topbar__right">
        <span class="topbar__line topbar__line--right" aria-hidden="true"></span>
        <div class="language-switch" aria-label="Выбор языка сайта">
          <span class="language-switch__active-pill" aria-hidden="true"></span>
            <button class="language-switch__button is-active" type="button" data-lang="ru" aria-label="Русский" title="Русский">
            <span class="language-switch__flag language-switch__flag--ru" aria-hidden="true">
              <svg viewBox="0 0 28 28" role="presentation" focusable="false">
                <rect width="28" height="9.34" y="0" fill="#FFFFFF"/>
                <rect width="28" height="9.33" y="9.34" fill="#2457A6"/>
                <rect width="28" height="9.33" y="18.67" fill="#D52B1E"/>
              </svg>
            </span>
          </button>
          <button class="language-switch__button" type="button" data-lang="en" aria-label="English" title="English">
            <span class="language-switch__flag language-switch__flag--gb" aria-hidden="true">
              <svg viewBox="0 0 28 28" role="presentation" focusable="false">
                <rect width="28" height="28" fill="#012169"/>
                <path d="M0 0L10.2 10.2M28 0L17.8 10.2M0 28L10.2 17.8M28 28L17.8 17.8" stroke="#FFFFFF" stroke-width="4.2"/>
                <path d="M0 0L10.2 10.2M28 0L17.8 10.2M0 28L10.2 17.8M28 28L17.8 17.8" stroke="#C8102E" stroke-width="1.9"/>
                <rect x="11.2" width="5.6" height="28" fill="#FFFFFF"/>
                <rect y="11.2" width="28" height="5.6" fill="#FFFFFF"/>
                <rect x="12.25" width="3.5" height="28" fill="#C8102E"/>
                <rect y="12.25" width="28" height="3.5" fill="#C8102E"/>
              </svg>
            </span>
          </button>
        </div>
      </div>
    </header>

    <section class="hero__content" id="top">
      <div class="hero__logo-wrap hero__logo-wrap--parallax">
        <img class="hero__logo" src="assets/IMG_8642.PNG" alt="ФОКУС — фотокомпания">
      </div>
      <p class="hero__tagline">
        <span data-i18n="tagline1">ВЫДЕЛЯЕМ ГЛАВНОЕ.</span><br>
        <span data-i18n="tagline2">СОЗДАЁМ ТО, ЧТО ХОЧЕТСЯ РАССМАТРИВАТЬ.</span>
      </p>
    </section>

    <footer class="bottombar">
      <div class="bottombar__actions">
        <a href="#contacts" class="contact-button">
          <span class="contact-button__dot"></span>
          <span data-i18n="discuss">ОБСУДИТЬ СЪЁМКУ</span>
        </a>
        <a href="#works" class="works-button">
          <span data-i18n="worksCta">СМОТРЕТЬ РАБОТЫ</span>
          <span class="works-button__arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </footer>

  </main>

  <section id="about" class="dummy-section"><span data-i18n="about">О КОМПАНИИ</span></section>
  <section id="services" class="dummy-section"><span data-i18n="services">УСЛУГИ</span></section>
  <section id="works" class="dummy-section"><span data-i18n="works">ПРИМЕРЫ РАБОТ</span></section>
  <section id="contacts" class="dummy-section"><span data-i18n="contacts">КОНТАКТЫ</span></section>

  <script>
    const hero = document.querySelector('.hero');
    const navLinks = [...document.querySelectorAll('.nav-panel__link')];
    const langButtons = [...document.querySelectorAll('.language-switch__button')];

    const dictionary = {
      ru: {
        home: 'ГЛАВНАЯ',
        about: 'О КОМПАНИИ',
        services: 'УСЛУГИ',
        works: 'ПРИМЕРЫ РАБОТ',
        contacts: 'КОНТАКТЫ',
        tagline1: 'ВЫДЕЛЯЕМ ГЛАВНОЕ.',
        tagline2: 'СОЗДАЁМ ТО, ЧТО ХОЧЕТСЯ РАССМАТРИВАТЬ.',
        discuss: 'ОБСУДИТЬ СЪЁМКУ',
        worksCta: 'СМОТРЕТЬ РАБОТЫ'
      },
      en: {
        company: 'PHOTOGRAPHY COMPANY',
        country: 'RUSSIA',
        home: 'HOME',
        about: 'ABOUT',
        services: 'SERVICES',
        works: 'SELECTED WORKS',
        contacts: 'CONTACTS',
        tagline1: 'WE HIGHLIGHT WHAT MATTERS.',
        tagline2: 'WE CREATE IMAGES YOU WANT TO KEEP LOOKING AT.',
        discuss: 'DISCUSS A SHOOT',
        worksCta: 'VIEW WORKS'
      }
    };

    let raf = 0;
    hero.addEventListener('pointermove', (event) => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const x = event.clientX / window.innerWidth - 0.5;
        const y = event.clientY / window.innerHeight - 0.5;
        hero.style.setProperty('--pointer-x', `${x * 8}px`);
        hero.style.setProperty('--pointer-y', `${y * 6}px`);
      });
    });

    hero.addEventListener('pointerleave', () => {
      hero.style.setProperty('--pointer-x', '0px');
      hero.style.setProperty('--pointer-y', '0px');
    });

    navLinks.forEach((link) => {
      link.addEventListener('click', () => {
        navLinks.forEach((item) => item.classList.remove('is-active'));
        link.classList.add('is-active');
      });
    });

    const observedSections = [
      document.getElementById('top'),
      document.getElementById('about'),
      document.getElementById('services'),
      document.getElementById('works'),
      document.getElementById('contacts')
    ].filter(Boolean);

    const sectionToLink = new Map(
      navLinks.map((link) => [link.getAttribute('href'), link])
    );

    if ('IntersectionObserver' in window) {
      const sectionObserver = new IntersectionObserver((entries) => {
        const visible = entries
          .filter((entry) => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];

        if (!visible) return;
        const link = sectionToLink.get(`#${visible.target.id}`);
        if (!link) return;

        navLinks.forEach((item) => item.classList.remove('is-active'));
        link.classList.add('is-active');
      }, { threshold: [0.35, 0.6, 0.8] });

      observedSections.forEach((section) => sectionObserver.observe(section));
    }

    function setLanguage(lang) {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        const key = element.dataset.i18n;
        if (dictionary[lang][key]) element.textContent = dictionary[lang][key];
      });
      langButtons.forEach((button) => {
        button.classList.toggle('is-active', button.dataset.lang === lang);
        button.setAttribute('aria-pressed', button.dataset.lang === lang ? 'true' : 'false');
      });
      document.querySelector('.language-switch').classList.toggle('is-en', lang === 'en');
      localStorage.setItem('focus-language', lang);
    }

    langButtons.forEach((button) => {
      button.addEventListener('click', () => setLanguage(button.dataset.lang));
    });

    const savedLanguage = localStorage.getItem('focus-language');
    setLanguage(savedLanguage === 'en' ? 'en' : 'ru');
  </script>
</body>
</html>
