<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ФОКУС — Панель заявок управляющей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0d;
      --card-bg: #111318;
      --border: rgba(255, 255, 255, 0.08);
      --lime: #CAFF1C;
      --text: #f4f1e9;
      --text-muted: rgba(244, 241, 233, 0.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: clamp(20px, 4vw, 40px);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-badge {
      font-size: 10px;
      font-weight: 800;
      background: var(--lime);
      color: #0c0d10;
      padding: 3px 8px;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .stat-val {
      font-size: 32px;
      font-weight: 800;
      color: var(--lime);
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-lime {
      background: var(--lime);
      color: #0c0d10;
    }
    .btn-lime:hover {
      background: #b7f707;
      transform: translateY(-2px);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid var(--border);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .table-wrap {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background: rgba(255, 255, 255, 0.02);
      padding: 16px 20px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 13.5px;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .client-name {
      font-weight: 700;
      color: #fff;
      margin-bottom: 3px;
    }
    .client-time {
      font-size: 11px;
      color: var(--text-muted);
    }
    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(202, 255, 28, 0.12);
      color: var(--lime);
      border: 1px solid rgba(202, 255, 28, 0.25);
    }
    .quick-actions {
      display: flex;
      gap: 8px;
    }
    .call-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 800;
      background: var(--lime);
      color: #0c0d10;
      text-decoration: none;
      transition: all 0.2s;
    }
    .call-btn:hover {
      transform: scale(1.04);
      background: #b7f707;
    }
    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 700;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      transition: all 0.2s;
    }
    .wa-btn:hover {
      transform: scale(1.04);
      background: #1eb956;
    }
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1 class="brand-title">ФОКУС</h1>
        <span class="brand-badge">Автопилот заявок</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <a href="index.html" class="btn btn-outline">← На сайт</a>
        <a href="leads.csv" download="leads_focus.csv" class="btn btn-lime">📥 Скачать Excel (CSV)</a>
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-val" id="totalCount">0</div>
        <div class="stat-label">Всего заявок</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color: #55f392;">Активна</div>
        <div class="stat-label">Связь управляющей: +7 (929) 850-85-03</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color: #60a5fa;" id="todayCount">0</div>
        <div class="stat-label">За последние 24 часа</div>
      </div>
    </div>

    <div class="actions-bar">
      <h2 style="font-size: 18px; font-weight: 800;">Журнал входящих лидов</h2>
      <div style="font-size: 12px; color: var(--text-muted);">
        Автообновление каждые 10 секунд • <span id="lastUpdated">...</span>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Время</th>
            <th>Имя / Компания</th>
            <th>Услуга</th>
            <th>О проекте</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="leadsTableBody">
          <tr>
            <td colspan="5" class="empty-state">Загрузка данных...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function cleanPhone(raw) {
      if (!raw) return '';
      let clean = raw.replace(/[^\d+]/g, '');
      if (clean.startsWith('8') && clean.length === 11) {
        clean = '+7' + clean.slice(1);
      }
      return clean;
    }

    function fetchLeads() {
      fetch('/api/leads')
        .then(res => res.json())
        .then(data => {
          document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString('ru-RU');
          if (!data || !data.leads || data.leads.length === 0) {
            document.getElementById('leadsTableBody').innerHTML = '<tr><td colspan="5" class="empty-state">Пока новых заявок нет. Они появятся здесь сразу при отправке с сайта.</td></tr>';
            document.getElementById('totalCount').textContent = '0';
            document.getElementById('todayCount').textContent = '0';
            return;
          }

          const leads = [...data.leads].reverse();
          document.getElementById('totalCount').textContent = data.count || leads.length;

          const now = Date.now();
          const dayAgo = now - 24 * 3600 * 1000;
          let today = 0;

          let html = '';
          leads.forEach(lead => {
            const timeDate = new Date(lead.created_at);
            if (!isNaN(timeDate.getTime()) && timeDate.getTime() > dayAgo) today++;

            const phone = cleanPhone(lead.contact);
            const isPhone = phone.length >= 10;
            const isTg = lead.contact && lead.contact.includes('@');

            html += `
              <tr>
                <td>
                  <div class="client-time">${lead.created_at || '—'}</div>
                  <div style="font-size: 10px; color: var(--text-muted); opacity: 0.6;">${lead.id || ''}</div>
                </td>
                <td>
                  <div class="client-name">${escapeHtml(lead.name || 'Без имени')}</div>
                  <div style="font-size: 12px; color: var(--lime); font-weight: 700;">${escapeHtml(lead.contact || '—')}</div>
                </td>
                <td>
                  <span class="tag">${escapeHtml(lead.service_name || lead.service || 'Общая')}</span>
                </td>
                <td style="max-width: 320px; line-height: 1.4; color: var(--text-muted); font-size: 12.5px;">
                  ${escapeHtml(lead.message || '—')}
                </td>
                <td>
                  <div class="quick-actions">
                    ${isPhone ? `<a href="tel:${phone}" class="call-btn" title="Позвонить">📞 Набрать</a>` : ''}
                    ${isPhone ? `<a href="https://wa.me/${phone.replace('+', '')}" target="_blank" class="wa-btn" title="Написать в WhatsApp">WhatsApp</a>` : ''}
                    ${isTg ? `<a href="https://t.me/${lead.contact.replace('@', '')}" target="_blank" class="call-btn" style="background:#2AABEE;color:#fff;">Telegram</a>` : ''}
                  </div>
                </td>
              </tr>
            `;
          });

          document.getElementById('todayCount').textContent = today;
          document.getElementById('leadsTableBody').innerHTML = html;
        })
        .catch(err => {
          console.warn('Dashboard fetch error:', err);
        });
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }

    fetchLeads();
    setInterval(fetchLeads, 10000);
  </script>
</body>
</html>
