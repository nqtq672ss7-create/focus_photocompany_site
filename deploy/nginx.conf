# ==============================================================================
# ФОКУС (FOCUS PHOTOCOMPANY) — PRODUCTION HARDENED NGINX CONFIGURATION
# High-Concurreny, Anti-DDoS, Zero-Crash & Maximum Speed Setup
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── LOGGING WITH CLOUDFLARE REAL IP SUPPORT ──────────────────────────────
    log_format main_secure '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_x_forwarded_for" '
                           'rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log main_secure buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ── PERFORMANCE TUNING ──────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    # ── ANTI-SLOWLORIS & TIMEOUT SHIELD ─────────────────────────────────────
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;
    reset_timedout_connection on;

    # ── BUFFER OVERFLOW & MEMORY EXHAUSTION MITIGATION ───────────────────────
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    client_max_body_size 10m;
    large_client_header_buffers 4 8k;

    # ── ANTI-DDOS RATE LIMITING & CONCURRENCY ZONES ─────────────────────────
    # Limit requests per IP address: 15 req/sec with burst of 30
    limit_req_zone $binary_remote_addr zone=req_limit:20m rate=15r/s;
    # Limit concurrent connections per IP address: max 20 simultaneous sockets
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;
    limit_req_status 429;
    limit_conn_status 429;

    # ── CLOUDFLARE PROXY REAL IP RESTORATION ────────────────────────────────
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── GZIP & COMPRESSION (LIGHTNING-FAST TRANSIT) ──────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── SERVER BLOCK: HTTP -> HTTPS REDIRECT ─────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name focus-photo.ru www.focus-photo.ru;

        # ACME Let's Encrypt validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── SERVER BLOCK: SECURE HTTPS PRODUCTION ────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name focus-photo.ru www.focus-photo.ru;

        root /var/www/focus;
        index index.html;

        # ── SSL CERTIFICATES & TLS 1.3 HARDENING ─────────────────────────────
        ssl_certificate /etc/letsencrypt/live/focus-photo.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/focus-photo.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ── DEFENSE-IN-DEPTH HTTP SECURITY HEADERS ───────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

        # Apply rate limiting & connection concurrency guards
        limit_req zone=req_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        # ── IMMUTABLE CACHING FOR STATIC ASSETS (JS/CSS/WEBP/SVG/FONTS) ──────
        location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            tcp_nodelay off;
            open_file_cache max=3000 inactive=120s;
            open_file_cache_valid 45s;
            open_file_cache_min_uses 2;
            open_file_cache_errors off;
        }

        # ── STREAMING MEDIA ASSETS (MP4, MP3) WITH HTTP RANGE SUPPORT ────────
        location ~* \.(?:mp4|mp3|webm|ogg)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header Accept-Ranges bytes;
            mp4;
            mp4_buffer_size 1m;
            mp4_max_buffer_size 10m;
        }

        # ── HTML PAGES (MUST REVALIDATE FOR INSTANT DEPLOYMENTS) ─────────────
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ── ANTI-EXPLOIT / SCANNER BLOCKER ──────────────────────────────────
        # Deny access to hidden dotfiles (.git, .env, .DS_Store, etc.)
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Deny access to server scripts, templates, backups, databases
        location ~* \.(?:py|sh|bash|sql|bak|log|db|sqlite3|ini|conf|ya?ml)$ {
            deny all;
            access_log off;
            return 404;
        }

        # Custom error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /index.html;
    }
}
