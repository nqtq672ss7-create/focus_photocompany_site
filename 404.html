<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0d11">

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0d11;
      --card-bg: #14161d;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --lime: #CAFF1C;
      --border: rgba(255, 255, 255, 0.08);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 32px 20px;
      line-height: 1.5;
    }
    .header {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #fff;
      text-decoration: none;
    }
    .logo span {
      color: var(--lime);
    }
    .main {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .code {
      font-size: clamp(64px, 15vw, 110px);
      font-weight: 800;
      line-height: 1;
      color: var(--lime);
      margin-bottom: 16px;
      letter-spacing: -0.03em;
    }
    h1 {
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 480px;
      margin: 0 auto 32px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .btn-primary {
      background: var(--lime);
      color: #0c0d11;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      border: 1px solid var(--border);
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .footer {
      width: 100%;
      max-width: 680px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      padding-top: 24px;
    }
    .footer a {
      color: inherit;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="logo">ФОКУС<span>.</span></a>
    <a href="tel:+79298508503" style="color:var(--text-muted);text-decoration:none;font-size:14px;font-weight:600;">+7 (929) 850-85-03</a>
  </header>

  <main class="main">
    <div class="code" aria-hidden="true">404</div>
    <h1>Страница не найдена</h1>
    <p>Кажется, адрес страницы был изменён или она была перемещена. Перейдите на главную страницу или свяжитесь с нами.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">НА ГЛАВНУЮ</a>
      <a href="/#services" class="btn btn-secondary">УСЛУГИ</a>
      <a href="/#works" class="btn btn-secondary">ПРИМЕРЫ СЪЁМОК</a>
      <a href="/#contacts" class="btn btn-secondary">КОНТАКТЫ</a>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Фотокомпания «ФОКУС». Все права защищены. <a href="https://t.me/zakonpudova" target="_blank" rel="noopener">Написать в Telegram</a></p>
  </footer>
